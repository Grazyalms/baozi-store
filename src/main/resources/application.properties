spring.application.name=baozi-store

# ===== BANCO ATIVO: H2 (não precisa instalar nada) =====
# Os dados ficam salvos no arquivo ./data/baozi_store e permanecem após reiniciar a API.
spring.datasource.url=jdbc:h2:file:./data/baozi_store;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== PARA USAR MySQL: comente o bloco do H2 acima e descomente este =====
